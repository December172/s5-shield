# dGPU rail-off fix for HP OMEN 16-ap0xxx (see /mnt/Shared/Development/Project/Others/s5-shield/README.md)
#
# 0000:01:00.0  NVIDIA GB206M RTX 5060 Max-Q (display)
# 0000:01:00.1  its HDMI/DP audio function (snd_hda_intel)
# 0000:00:01.1  the PCIe root port it hangs off (pcieport)
#
# noshut: only these drivers may have .shutdown nulled at poweroff. pcieport is
# deliberately absent: it governs every PCIe port on the machine.
#
# wait_ms: how long the module waits for the dGPU (and its bridge) to settle
# before it disables runtime PM. 20000 (20 s) is the default AND a measurement,
# not a taste: with the same module binary, arming a subtree that was still
# awake with no wait left the rail on (18.51 W over 0.34 h, ledger FAIL) while
# 20000 cut it (0.43 W over 11.12 h). Arming is a one-way door - it takes away
# the ability to suspend - so this wait is the step that makes the rest of the
# fix reachable, not an optimisation.
#
# The wait returns as soon as the subtree is settled, so a generous budget costs
# nothing when the dGPU is already asleep, and at most itself when it cannot
# settle at all (a held reference: no budget clears that, and that case is what
# a shutdown-time fallback is for). 0 disables the wait, which is only correct
# where userspace has already waited - upstream ships a shutdown policy that
# waits up to 90 s before its module is even loaded.
options s5_shield devs=0000:01:00.0,0000:01:00.1,0000:00:01.1 noshut=nvidia,snd_hda_intel wait_ms=20000

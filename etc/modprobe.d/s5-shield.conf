# dGPU rail-off fix for HP OMEN 16-ap0xxx (see /mnt/Shared/Development/Project/Others/s5-shield/README.md)
#
# 0000:01:00.0  NVIDIA GB206M RTX 5060 Max-Q (display)
# 0000:01:00.1  its HDMI/DP audio function (snd_hda_intel)
# 0000:00:01.1  the PCIe root port it hangs off (pcieport)
#
# noshut: only these drivers may have .shutdown nulled at poweroff. pcieport is
# deliberately absent: it governs every PCIe port on the machine.
#
# wait_ms: how long the module waits for the dGPU (and its bridge) to settle
# before it disables runtime PM. 0 = do not wait, and that is what this machine
# is configured for, because the wait cannot do what revision 1.3 added it for:
# a device that can suspend has already been idle-notified by the runtime PM
# core, one that cannot returns -EAGAIN/-EBUSY, and the references that keep the
# dGPU awake are released later, inside device_shutdown() - which is exactly
# what the module's FINAL line records. Measured here: the wait ran its full
# 5000 ms with the GPU still in D0 and the S5 that followed still cost ~1 W over
# 50 minutes. Set 5000 only to re-run that experiment.
options s5_shield devs=0000:01:00.0,0000:01:00.1,0000:00:01.1 noshut=nvidia,snd_hda_intel wait_ms=0
